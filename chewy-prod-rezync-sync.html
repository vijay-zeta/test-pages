<script async type="text/javascript">

        var z_src = "https://live.rezync.com/sync?c=16b6410431b6374e780104abb0443ca8&p=d07201a4cbb400f02b9ca49a10efe661&k=chewy-prod-pixel-7615&zmpID="+zmpID+"&cache_buster="+cache_buster+"&PageUrl="+PageUrl;

        document.body.appendChild(z);

    if (['complete', 'interactive'].indexOf(document.readyState) >= 0) {
